[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plagues-broadcast-station"
version = "0.1.0"
description = "A music, artwork and synchronized lyric broadcast station for Windows and Linux"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "numpy>=1.26,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
build = ["pyinstaller>=6.10,<7"]

[project.scripts]
plagues-broadcast-station = "gnb_player.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gnb_player = ["extraction_backend/*.py", "extract_worker.py", "extraction.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
