[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plagues-broadcast-station"
version = "0.2.4rc11.dev15"
description = "A music, artwork and synchronized lyric broadcast station for Windows and Linux"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "numpy>=1.26,<3", "keyring>=25.7,<26"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "soundfile>=0.12,<1"]
# The Linux credential bundle explicitly collects metadata for these packages.
# Distribution-supplied cryptography may not declare its native dependencies.
build = [
    "pyinstaller>=6.10,<7",
    "cffi>=1.15; sys_platform == 'linux'",
    "pycparser>=2.21; sys_platform == 'linux'",
]

[project.scripts]
plagues-broadcast-station = "gnb_player.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gnb_player = ["review_worker.py", "review_backend.py", "review_capture.py", "review_repetition.py", "review_partial.py", "alignment_contract.py", "supplied_text_contract.py", "recognition_policy.py", "review_qwen_worker.py", "qwen_review_backend.py", "qwen_review_contract.py", "review_device.py", "extraction_backend/*.py", "extract_worker.py", "extraction.py", "recognition_drafts.py", "model_install.py", "model_install_worker.py", "model_discovery.py", "assets/*.png", "assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
