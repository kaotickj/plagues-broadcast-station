name: Native desktop builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04
            artifact: PlaguesBroadcastStation-linux-x86_64
          - name: Windows x86_64
            os: windows-latest
            artifact: PlaguesBroadcastStation-windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      QT_MEDIA_BACKEND: ffmpeg
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Linux Qt system libraries
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          # The runner's Azure mirror can stall on every small package. Keep
          # Ubuntu's normal signed repositories, using their HTTPS origin.
          for pbs_mirrors in /etc/apt/apt-mirrors.txt /etc/apt/apt-mirrors-security.txt; do
            if [[ -f "$pbs_mirrors" ]]; then
              if [[ "$pbs_mirrors" == *security* ]]; then
                printf '%s\n' 'https://security.ubuntu.com/ubuntu/' | sudo tee "$pbs_mirrors" >/dev/null
              else
                printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee "$pbs_mirrors" >/dev/null
              fi
            fi
          done
          for pbs_sources in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [[ -f "$pbs_sources" ]]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$pbs_sources"
            fi
          done
          if ! sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update; then
            echo 'Package index refresh was incomplete; trying the runner package metadata.'
          fi
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg libegl1 libgl1 libxkbcommon0 libxcb-cursor0 libasound2 libpulse0
      - name: Windows FFmpeg tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed.' }
          }
          $ffmpeg = Get-ChildItem "$env:ChocolateyInstall\lib\ffmpeg*" -Recurse -Filter ffmpeg.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($ffmpeg) { Add-Content $env:GITHUB_PATH $ffmpeg.DirectoryName }
      - name: Install desktop build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[build,test]"
      - name: Run model-free tests
        run: python -m pytest -q
      - name: Build native standalone folder
        shell: python
        run: |
          import os, subprocess, sys
          if os.name != 'nt':
              subprocess.run([sys.executable, 'scripts/build_linux_installer.py', '--record-source'], check=True)
          subprocess.run([sys.executable, '-m', 'PyInstaller', '--clean', '--noconfirm', 'PlaguesBroadcastStation.spec'], check=True)
      - name: Smoke-test packaged binaries
        shell: python
        run: |
          import json, os, pathlib, subprocess, tempfile, time
          bundle = pathlib.Path('dist/PlaguesBroadcastStation').resolve()
          internal = bundle / '_internal'
          suffix = '.exe' if os.name == 'nt' else ''
          executable = bundle / ('PlaguesBroadcastStation' + suffix)
          environment = os.environ.copy()
          environment['PATH'] = os.pathsep.join((str(internal / 'bin'), str(internal)))
          environment['QT_QPA_PLATFORM'] = 'offscreen'
          environment['QT_MEDIA_BACKEND'] = 'ffmpeg'
          if os.name != 'nt':
              environment['LD_LIBRARY_PATH'] = str(internal)
          with tempfile.TemporaryDirectory(prefix='station packaged smoke ') as temporary:
              subprocess.run([str(executable), '--help'], cwd=temporary, env=environment,
                             capture_output=True, text=True, errors='replace', check=True, timeout=30)
              for name in ('ffmpeg', 'ffprobe'):
                  result = subprocess.run([str(internal / 'bin' / (name + suffix)), '-version'],
                                          cwd=temporary, env=environment, capture_output=True,
                                          text=True, errors='replace', check=True, timeout=30)
                  print(result.stdout.splitlines()[0])
              for name, extra in (('operator', []), ('model setup', ['--setup-models'])):
                  process = subprocess.Popen([str(executable), '--data-dir', str(pathlib.Path(temporary) / (name + ' settings')), *extra],
                                             cwd=temporary, env=environment, stdout=subprocess.PIPE,
                                             stderr=subprocess.PIPE, text=True, errors='replace')
                  try:
                      time.sleep(3)
                      if process.poll() is not None:
                          stdout, stderr = process.communicate(timeout=5)
                          raise AssertionError('Packaged ' + name + ' exited early: ' + str(process.returncode)
                                               + '\n' + stdout[-2000:] + '\n' + stderr[-2000:])
                      print('Packaged offscreen ' + name + ' stayed running for three seconds.')
                  finally:
                      if process.poll() is None:
                          process.terminate()
                      try:
                          process.communicate(timeout=10)
                      except subprocess.TimeoutExpired:
                          process.kill()
                          process.communicate(timeout=5)
              events = pathlib.Path(temporary) / 'installer events.jsonl'
              result = pathlib.Path(temporary) / 'installer result.json'
              refused = subprocess.run([str(executable), '--model-install-worker', '--events-file', str(events),
                                        '--result-file', str(result)], cwd=temporary, env=environment,
                                       capture_output=True, text=True, errors='replace', timeout=30)
              assert refused.returncode == 1, (refused.returncode, refused.stderr[-2000:])
              reports = [json.loads(line) for line in events.read_text(encoding='utf-8').splitlines()]
              assert reports[-1]['type'] == 'error', reports
              assert 'explicit Install action' in reports[-1]['message'], reports
              assert not result.exists(), 'A refused installation must not create successful model settings.'
              print('Packaged installer refused execution without an explicit install action; no models downloaded.')
      - name: Include platform launchers
        shell: python
        run: |
          import pathlib, shutil, os
          source = pathlib.Path('run-windows.bat' if os.name == 'nt' else 'run-linux.sh')
          target = pathlib.Path('dist/PlaguesBroadcastStation') / source.name
          shutil.copy2(source, target)
          for name in ('README.md', 'INSTALLER.md', 'THIRD_PARTY_NOTICES.md', 'requirements-lyrics.txt'):
              shutil.copy2(name, target.parent / name)
          shutil.copytree('docs', target.parent / 'docs', dirs_exist_ok=True)
      - name: Package build
        shell: python
        run: |
          import pathlib, shutil
          pathlib.Path('artifacts').mkdir(exist_ok=True)
          shutil.make_archive('artifacts/${{ matrix.artifact }}', 'zip', 'dist', 'PlaguesBroadcastStation')
      - name: Package Linux installer
        if: runner.os == 'Linux'
        run: python scripts/build_linux_installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
